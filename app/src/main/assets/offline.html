<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>muufi — offline</title>
  <style>
    html, body { margin:0; height:100%; background:#0b1220; color:#e8ecf5;
      font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .wrap { height:100%; display:flex; flex-direction:column; align-items:center;
      justify-content:center; text-align:center; padding:24px; gap:10px; }
    .big { font-size:44px; }
    h1 { margin:0; font-size:20px; }
    p { margin:0; color:#9aa7c2; font-size:14px; max-width:320px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="big">📡</div>
    <h1>No internet connection</h1>
    <p>muufi loads news from the web. Reconnect, then tap <b>Refresh</b> below to try again.</p>
  </div>
</body>
</html>
